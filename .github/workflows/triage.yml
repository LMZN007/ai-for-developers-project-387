name: Claude triage

# A new issue is triaged without waiting for the owner: the agent follows the `triage` skill and sets
# one category and one state. It acts as the Claude GitHub App (`claude[bot]`) and runs on the owner's
# Claude subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`).
on:
  issues:
    types: [opened]

permissions: {}

# One run per issue. `opened` fires once per issue, so a queue is not expected; the group only
# guards against a re-run of the same event racing the original run on the same labels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    # Two filters, both needed:
    # 1. The author is OWNER/MEMBER/COLLABORATOR and not a bot: the issue text goes into the agent's
    #    prompt context, so outsiders' text does not spend a run or reach an agent with write tools.
    # 2. The issue has no state label yet. Tickets prepared by skills (created by `claude[bot]`, or by
    #    the owner right away with `ready-for-agent`) already carry a state and were triaged by a
    #    human-supervised session. The `opened` event delivers the labels set at creation, so such an
    #    issue is skipped and its brief is never overwritten by an unattended run.
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
      && github.event.issue.user.type != 'Bot'
      && !contains(github.event.issue.labels.*.name, 'needs-triage')
      && !contains(github.event.issue.labels.*.name, 'needs-info')
      && !contains(github.event.issue.labels.*.name, 'ready-for-agent')
      && !contains(github.event.issue.labels.*.name, 'ready-for-human')
      && !contains(github.event.issue.labels.*.name, 'wontfix')
    runs-on: ubuntu-latest
    # Triage reads the issue and a part of the code and posts one comment; a normal run takes a few
    # minutes. 15 minutes is a margin for a slow codebase search, and a hung run does not hold a
    # runner for the 6-hour default.
    timeout-minutes: 15
    # Standard mode: the action trades the OIDC token for a Claude App token, and that token labels
    # and comments. The workflow's own GITHUB_TOKEN only reads.
    permissions:
      contents: read
      id-token: write
    steps:
      # The agent reads the skill, the label map, and the code from the checkout.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@cb5e706113afc5dc4f36cdcf5d784ca88f351823 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The `triage` skill has `disable-model-invocation: true`, so the Skill tool cannot call it;
          # the prompt tells the agent to read and follow the file instead.
          prompt: |
            Новое обращение: issue #${{ github.event.issue.number }} в ${{ github.repository }}.

            Прочитай `.claude/skills/triage/SKILL.md` и выполни его для этого issue. Карта меток —
            в `docs/agents/triage-labels.md`. Работай без человека: вопросов в чат не задавай,
            ответа не жди.

            Что можно:
            - прочитать issue, его комментарии и код; ничего не менять в коде и файлах;
            - поставить ровно одну категорию (`bug` или `enhancement`);
            - поставить ровно одно состояние: `needs-triage` или `needs-info`.
              Для `needs-info` оставь комментарий по шаблону Triage Notes из скилла
              с конкретными вопросами автору. Для `needs-triage` комментарий нужен,
              только если есть промежуточные выводы.

            Чего нельзя:
            - ставить `ready-for-agent`, `ready-for-human`, `wontfix`;
            - закрывать issue;
            - менять код, создавать ветки и PR;
            - писать агентский бриф: это решает владелец.
            Если по скиллу issue выглядит готовым к `ready-for-agent`, `ready-for-human` или `wontfix`,
            поставь `needs-triage` и в комментарии назови рекомендуемое состояние и причину.

            Каждый комментарий начинается с дисклеймера скилла:
            > *This was generated by AI during triage.*
          # gh is the only way the agent writes: the list leaves out `gh issue close` and any code change.
          claude_args: >-
            --model claude-sonnet-5-5
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"
