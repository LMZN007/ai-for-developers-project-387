name: Browser check

# An independent browser check of every PR, apart from the agent and from CI: its own runner builds
# the exact commit of the PR head as in production and runs the Playwright scenario against it.
# The artifact carries the commit it was made for, so a result is never taken for another commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push makes the check of the old commit obsolete: cancel it and check the new one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The same as the `check` job in CI: install, production build, one Playwright scenario.
    timeout-minutes: 15
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The exact PR head commit, not the merge commit that `pull_request` checks out by default:
      # the result belongs to the code the author pushed. A fork PR runs without secrets.
      - name: Checkout the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Installs the tools pinned in mise.toml; the postinstall hook runs `mise run setup`.
      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `mise run setup` already downloaded Chromium; Ubuntu also needs its system libraries.
      - name: Install Chromium system libraries
        run: mise exec -- pnpm --filter @calls-booking/e2e exec playwright install-deps chromium

      # Playwright starts the production build (`vite build` and one server for the API and the
      # pages) on port 3100 with an empty store. The result is recorded below, so the artifact is
      # uploaded whatever the outcome.
      - name: Run the browser scenario
        id: e2e
        continue-on-error: true
        run: mise run e2e

      - name: Collect the report
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          set -euo pipefail
          mkdir -p browser-check
          echo "$HEAD_SHA" > browser-check/head-sha.txt
          if [ "$E2E_OUTCOME" = "success" ]; then
            echo "passed" > browser-check/result.txt
          else
            echo "failed" > browser-check/result.txt
          fi
          if [ -d apps/e2e/playwright-report ]; then
            cp -r apps/e2e/playwright-report browser-check/playwright-report
          fi
          if [ -d apps/e2e/test-results ]; then
            cp -r apps/e2e/test-results browser-check/test-results
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-check-${{ github.event.pull_request.head.sha }}
          path: browser-check/
          if-no-files-found: error
          retention-days: 14

      # The step above is `continue-on-error`, so the job fails here, after the artifact is saved.
      - name: Fail the job if the scenario failed
        if: steps.e2e.outcome != 'success'
        run: |
          echo "::error::Browser scenario failed for $HEAD_SHA; see the artifact browser-check-$HEAD_SHA."
          exit 1
